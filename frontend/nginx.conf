server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Must exceed the backend's 50 MB archive limit, so the backend gives the clear error.
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: every other URL is handled by React Router in the browser.
    location / {
        try_files $uri /index.html;
    }
}
