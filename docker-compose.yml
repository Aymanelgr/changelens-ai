# Starts the whole platform with one command: docker compose up --build
# Ports are bound to 127.0.0.1 so the demo is never exposed on the local network.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      STORAGE_DIR: /data/storage
      HF_HOME: /data/model-cache
      OLLAMA_URL: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:-mistral:7b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - file-storage:/data/storage
      - model-cache:/data/model-cache
    depends_on:
      db:
        condition: service_healthy

  # Local models: requirements and code never leave the machine. No published port, so only the
  # backend can reach it. docker-compose.gpu.yml adds the graphics card.
  ollama:
    image: ollama/ollama:0.40.14
    environment:
      OLLAMA_MODELS: /models
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/models

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  db-data:
  file-storage:
  model-cache:
  ollama-models:
