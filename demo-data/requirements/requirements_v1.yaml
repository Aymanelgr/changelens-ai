requirements:
  - id: REQ-012
    title: Vérification des virements élevés
    text: "Les virements supérieurs à 10 000 MAD nécessitent une vérification supplémentaire."
  - id: REQ-020
    title: Robustesse des mots de passe
    text: "Le mot de passe doit contenir au moins 12 caractères."
  - id: REQ-031
    title: Historique des virements
    text: "L'historique des virements est consultable."
  - id: REQ-040
    title: Relevé papier
    text: "Le client peut demander un relevé papier."
